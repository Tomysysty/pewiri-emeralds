<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Herramienta interna de Pewiri Emeralds: caracterización SVP-9 de esmeraldas y cálculo de precios de lotes, piedras y productos.">
  <meta name="theme-color" content="#eaf5ec">
  <title>Pewiri Emeralds · Caracterización y precios</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="img/logo.svg">
</head>
<body>
  <div class="ambiente" aria-hidden="true"></div>
  <a class="salto-contenido" href="#vista">Saltar al contenido</a>

  <header class="cabecera">
    <a class="marca" href="#" onclick="return false;">
      <img class="logo" src="img/logo.png" alt="Pewiri Emeralds"
           onerror="this.onerror=null; this.src='img/logo.svg';">
      <span class="palabra-marca">Pewiri Emeralds</span>
    </a>
    <nav class="pestanas">
      <span class="pildora" aria-hidden="true"></span>
      <button class="pestana activa" data-vista="inicio">Inicio</button>
      <button class="pestana" data-vista="caracterizacion">Caracterización</button>
      <button class="pestana" data-vista="lote">Lote</button>
      <button class="pestana" data-vista="piedra">Piedra</button>
      <button class="pestana" data-vista="producto">Producto</button>
      <button class="pestana" data-vista="mercado">Mercado</button>
      <button class="pestana" data-vista="configuracion">Configuración</button>
    </nav>
  </header>

  <main id="vista"></main>

  <footer class="pie">
    <span>Calculadora de precios · uso interno</span>
    <span>Los datos se guardan en este navegador. Exporta un respaldo desde <strong>Configuración</strong> cada tanto.</span>
  </footer>

  <div id="toast"></div>

  <script src="js/calc.js"></script>
  <script src="js/svp9.js"></script>
  <script src="js/iconos.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/vistas/inicio.js"></script>
  <script src="js/vistas/caracterizacion.js"></script>
  <script src="js/vistas/lote.js"></script>
  <script src="js/vistas/piedra.js"></script>
  <script src="js/vistas/producto.js"></script>
  <script src="js/vistas/mercado.js"></script>
  <script src="js/vistas/configuracion.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
