<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pewiri Emeralds · Calculadora de precios</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="img/logo.svg">
</head>
<body>

  <header class="cabecera">
    <a class="marca" href="#" onclick="return false;">
      <img class="logo" src="img/logo.png" alt="Pewiri Emeralds"
           onerror="this.onerror=null; this.src='img/logo.svg';">
      <span class="palabra-marca">Pewiri Emeralds</span>
    </a>
    <nav class="pestanas">
      <button class="pestana activa" data-vista="lote">Lote</button>
      <button class="pestana" data-vista="piedra">Piedra</button>
      <button class="pestana" data-vista="producto">Producto</button>
      <button class="pestana" data-vista="mercado">Mercado</button>
      <button class="pestana" data-vista="configuracion">Configuración</button>
    </nav>
  </header>

  <main id="vista"></main>

  <footer class="pie">
    <span>Calculadora de precios · uso interno</span>
    <span>Los datos se guardan en este navegador. Exporta un respaldo desde <strong>Configuración</strong> cada tanto.</span>
  </footer>

  <div id="toast"></div>

  <script src="js/calc.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/vistas/lote.js"></script>
  <script src="js/vistas/piedra.js"></script>
  <script src="js/vistas/producto.js"></script>
  <script src="js/vistas/mercado.js"></script>
  <script src="js/vistas/configuracion.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
